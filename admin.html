<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gombo News Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  width: 92%;
  max-width: 800px;
  margin: 25px auto;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

textarea {
  min-height: 250px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border: 0;
  border-radius: 6px;
  background: #d71920;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  background: #333;
}

label {
  font-weight: bold;
}

#adminPanel {
  display: none;
}

#message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 6px;
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>Gombo News Admin</h1>
  <p>News Publishing Dashboard</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginPanel">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input id="email" type="email" placeholder="Admin email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN -->
  <div class="card" id="adminPanel">

    <h2>Publish a News Story</h2>

    <label>Headline</label>
    <input id="title" type="text" placeholder="Enter news headline">

    <label>Category</label>
    <select id="category">
      <option>Uganda</option>
      <option>Business</option>
      <option>Sports</option>
      <option>Entertainment</option>
      <option>Africa</option>
      <option>World</option>
    </select>

    <label>Image URL</label>
    <input id="image" type="text" placeholder="Paste image URL">

    <label>Author</label>
    <input id="author" type="text" placeholder="Author name">

    <label>News Story</label>
    <textarea id="content" placeholder="Write your news story here..."></textarea>

    <button onclick="publishStory()">PUBLISH STORY</button>

    <button class="secondary" onclick="logout()">LOG OUT</button>

    <div id="message"></div>

  </div>

</div>


<script>

// YOUR SUPABASE DETAILS
const SUPABASE_URL = "https://ljdyhkffarslfgrqawrn.supabase.co";
const SUPABASE_KEY = "sb_publishable_oCFEhHMC7ETCXNwJKIFzwg_qOdA9f0i";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// LOGIN
async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const loginMessage =
    document.getElementById("loginMessage");

  loginMessage.style.display = "block";
  loginMessage.innerText = "Logging in...";

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    loginMessage.innerText =
      "Login failed: " + error.message;
    return;
  }

  showAdmin();
}


// SHOW ADMIN
function showAdmin() {

  document.getElementById("loginPanel").style.display = "none";

  document.getElementById("adminPanel").style.display = "block";
}


// LOGOUT
async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("adminPanel").style.display = "none";

  document.getElementById("loginPanel").style.display = "block";
}


// PUBLISH
async function publishStory() {

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const image_url =
    document.getElementById("image").value.trim();

  const author =
    document.getElementById("author").value.trim();

  const content =
    document.getElementById("content").value.trim();

  const message =
    document.getElementById("message");

  if (!title || !content) {

    message.style.display = "block";

    message.innerText =
      "Please enter a headline and news story.";

    return;
  }

  message.style.display = "block";
  message.innerText = "Publishing...";

  const { error } =
    await supabaseClient
      .from("articles")
      .insert([{
        title: title,
        category: category,
        content: content,
        image_url: image_url || null,
        author: author || "Gombo News",
        published: true
      }]);

  if (error) {

    message.innerText =
      "Publishing failed: " + error.message;

    return;
  }

  message.innerText =
    "✅ Story published successfully!";

  document.getElementById("title").value = "";
  document.getElementById("image").value = "";
  document.getElementById("author").value = "";
  document.getElementById("content").value = "";
}


// CHECK LOGIN WHEN PAGE OPENS
async function checkUser() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {
    showAdmin();
  }
}

checkUser();

</script>

</body>
</html>
