<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gombo News Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  width: 92%;
  max-width: 800px;
  margin: 25px auto;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 10px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

textarea {
  min-height: 250px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  background: #d71920;
  color: white;
  border: 0;
  border-radius: 6px;
  font-size: 17px;
  font-weight: bold;
}

#message {
  margin-top: 15px;
  padding: 12px;
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>Gombo News Admin</h1>
  <p>Publish a News Story</p>
</header>

<div class="container">

<div class="card">

<label>News Headline</label>
<input id="title" type="text" placeholder="Enter headline">

<label>Category</label>
<select id="category">
  <option>Uganda</option>
  <option>Business</option>
  <option>Sports</option>
  <option>Entertainment</option>
  <option>Africa</option>
  <option>World</option>
</select>

<label>Image URL</label>
<input id="image" type="text" placeholder="Paste image URL">

<label>Author</label>
<input id="author" type="text" placeholder="Your name">

<label>News Story</label>
<textarea id="content" placeholder="Write your story here..."></textarea>

<button onclick="publishStory()">PUBLISH STORY</button>

<div id="message"></div>

</div>
</div>

<script>

// PUT YOUR SUPABASE DETAILS BELOW

const SUPABASE_URL = "https://ljdyhkffarslfgrqawrn.supabase.co";

const SUPABASE_KEY = "sb_publishable_oCFEhHMC7ETCXNwJKIFzwg_qOdA9f0i";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function publishStory() {

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const image_url =
    document.getElementById("image").value.trim();

  const author =
    document.getElementById("author").value.trim();

  const content =
    document.getElementById("content").value.trim();

  const message =
    document.getElementById("message");

  if (!title || !content) {
    message.style.display = "block";
    message.innerText =
      "Please enter the headline and news story.";
    return;
  }

  message.style.display = "block";
  message.innerText = "Publishing...";

  const { data, error } =
    await supabaseClient
      .from("articles")
      .insert([
        {
          title: title,
          category: category,
          content: content,
          image_url: image_url || null,
          author: author || "Gombo News",
          published: true
        }
      ])
      .select();

  if (error) {

    console.error(error);

    message.innerText =
      "Publishing failed: " + error.message;

    return;
  }

  message.innerText =
    "✅ Story published successfully!";

  document.getElementById("title").value = "";
  document.getElementById("image").value = "";
  document.getElementById("author").value = "";
  document.getElementById("content").value = "";
}

</script>

</body>
</html>
