<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gombo News Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.container {
  width: 92%;
  max-width: 800px;
  margin: 25px auto;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

textarea {
  min-height: 250px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  background: #d71920;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #b9141a;
}

#message {
  margin-top: 15px;
  padding: 12px;
  display: none;
  background: #e8f5e9;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>
  <h1>Gombo News Admin</h1>
  <p>Publish a News Story</p>
</header>

<div class="container">

  <div class="card">

    <label for="title">News Headline</label>
    <input
      type="text"
      id="title"
      placeholder="Enter your headline"
    >

    <label for="category">Category</label>
    <select id="category">
      <option value="Uganda">Uganda</option>
      <option value="Business">Business</option>
      <option value="Sports">Sports</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Africa">Africa</option>
      <option value="World">World</option>
    </select>

    <label for="image">Image URL</label>
    <input
      type="text"
      id="image"
      placeholder="Paste your image URL"
    >

    <label for="author">Author</label>
    <input
      type="text"
      id="author"
      placeholder="Your name"
    >

    <label for="content">News Story</label>
    <textarea
      id="content"
      placeholder="Write your news story here..."
    ></textarea>

    <button onclick="publishStory()">
      PUBLISH STORY
    </button>

    <div id="message"></div>

  </div>

</div>

<script>

function publishStory() {

  const title = document.getElementById("title").value.trim();
  const category = document.getElementById("category").value;
  const image = document.getElementById("image").value.trim();
  const author = document.getElementById("author").value.trim();
  const content = document.getElementById("content").value.trim();

  const message = document.getElementById("message");

  if (!title || !content) {
    message.style.display = "block";
    message.style.background = "#ffebee";
    message.innerText =
      "Please enter a headline and the news story.";
    return;
  }

  const story = {
    title: title,
    category: category,
    image: image,
    author: author,
    content: content,
    date: new Date().toLocaleString()
  };

  localStorage.setItem(
    "gomboLatestStory",
    JSON.stringify(story)
  );

  message.style.display = "block";
  message.style.background = "#e8f5e9";
  message.innerText =
    "Story saved successfully on this device.";

}

</script>

</body>
</html>
