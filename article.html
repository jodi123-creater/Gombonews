<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Gombo News</title>

<meta id="description"
name="description"
content="Gombo News">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header a {
  color: white;
  text-decoration: none;
  font-size: 28px;
  font-weight: bold;
}

.container {
  width: 92%;
  max-width: 800px;
  margin: 25px auto;
}

.article {
  background: white;
  padding: 25px;
  border-radius: 8px;
}

.category {
  color: #d71920;
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
}

h1 {
  font-size: 38px;
  line-height: 1.2;
  margin: 10px 0;
}

.meta {
  color: #777;
  margin-bottom: 20px;
}

.article img {
  width: 100%;
  height: auto;
  border-radius: 6px;
  margin-bottom: 20px;
}

.story {
  font-size: 19px;
  line-height: 1.8;
  white-space: pre-line;
}

.ad {
  background: #e8e8e8;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  margin: 25px 0;
  border-radius: 6px;
}

.back {
  display: inline-block;
  margin-top: 25px;
  color: #d71920;
  font-weight: bold;
  text-decoration: none;
}

@media(max-width:600px) {

  h1 {
    font-size: 29px;
  }

  .article {
    padding: 18px;
  }

  .story {
    font-size: 17px;
  }

}

</style>

</head>

<body>

<header>

<a href="index.html">
Gombo News
</a>

</header>


<div class="container">

<div class="ad">
Advertisement
</div>


<article class="article">

<div id="category"
class="category">
Loading...
</div>

<h1 id="title">
Loading article...
</h1>

<div id="meta"
class="meta">
</div>


<img id="image"
style="display:none;"
alt="">


<div id="content"
class="story">
</div>


<div class="ad">
Advertisement
</div>


<a class="back"
href="index.html">
← Back to Gombo News
</a>

</article>

</div>


<script>

// SUPABASE CONNECTION

const SUPABASE_URL =
"YOUR_PROJECT_URL";

const SUPABASE_KEY =
"YOUR_PUBLISHABLE_KEY";


const supabaseClient =
window.supabase.createClient(
  https://ljdyhkffarslfgrqawrn.supabase.co,
  sb_publishable_oCFEhHMC7ETCXNwJKIFzwg_qOdA9f0i
);


// GET ARTICLE ID FROM URL

const params =
new URLSearchParams(
  window.location.search
);

const articleId =
params.get("id");


// LOAD ARTICLE

async function loadArticle() {

  if (!articleId) {

    document.getElementById("title").innerText =
      "Article not found.";

    return;
  }


  const { data, error } =
    await supabaseClient
      .from("articles")
      .select("*")
      .eq("id", articleId)
      .eq("published", true)
      .single();


  if (error || !data) {

    document.getElementById("title").innerText =
      "Article not found.";

    return;
  }


  document.getElementById("title").innerText =
    data.title;


  document.getElementById("category").innerText =
    data.category;


  document.getElementById("content").innerText =
    data.content;


  document.getElementById("meta").innerText =
    "By " +
    (data.author || "Gombo News") +
    " • " +
    new Date(data.created_at)
      .toLocaleString();


  if (data.image_url) {

    const image =
      document.getElementById("image");

    image.src =
      data.image_url;

    image.alt =
      data.title;

    image.style.display =
      "block";
  }


  document.title =
    data.title + " | Gombo News";


  document
    .getElementById("description")
    .setAttribute(
      "content",
      data.content.substring(0, 155)
    );

}


loadArticle();

</script>

</body>
</html>
