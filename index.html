<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gombo News | Uganda News</title>

<meta name="description"
content="Latest Uganda and Africa news from Gombo News.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.logo span {
  color: #f4b400;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 15px;
  font-size: 14px;
}

.breaking {
  background: #d71920;
  color: white;
  padding: 10px 5%;
  font-weight: bold;
}

.container {
  width: 90%;
  max-width: 1100px;
  margin: 25px auto;
}

.ad {
  background: #e8e8e8;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  margin: 20px 0;
  border-radius: 6px;
}

.section-title {
  font-size: 24px;
  margin: 25px 0 15px;
  border-left: 5px solid #d71920;
  padding-left: 10px;
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card img {
  width: 100%;
  height: 190px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.category {
  color: #d71920;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

.card h3 {
  margin: 8px 0;
  font-size: 19px;
  line-height: 1.3;
}

.card p {
  color: #666;
  font-size: 14px;
  line-height: 1.5;
}

.date {
  margin-top: 10px;
  color: #999;
  font-size: 12px;
}

.read {
  display: inline-block;
  margin-top: 12px;
  color: #d71920;
  text-decoration: none;
  font-weight: bold;
}

.empty {
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 8px;
}

footer {
  background: #111;
  color: #bbb;
  text-align: center;
  padding: 30px 15px;
  margin-top: 40px;
}

footer h2 {
  color: white;
  margin-bottom: 10px;
}

@media(max-width:700px) {

  header {
    display: block;
  }

  nav {
    margin-top: 12px;
  }

  nav a {
    margin: 0 10px 0 0;
  }

  .news-grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<header>

<div class="logo">
Gombo<span>News</span>
</div>

<nav>
<a href="index.html">Home</a>
<a href="index.html">Uganda</a>
<a href="index.html">Business</a>
<a href="index.html">Sports</a>
<a href="index.html">Entertainment</a>
</nav>

</header>


<div class="breaking">
BREAKING NEWS • Gombo News
</div>


<div class="container">

<div class="ad">
Advertisement
</div>


<h2 class="section-title">
Latest News
</h2>


<div id="news" class="news-grid">

<div class="empty">
Loading latest news...
</div>

</div>


<div class="ad">
Advertisement
</div>

</div>


<footer>

<h2>Gombo News</h2>

<p>
Uganda News • Africa • Business • Sports • Entertainment
</p>

<p>
© 2026 Gombo News
</p>

</footer>


<script>

// SUPABASE

const SUPABASE_URL =
"https://ljdyhkffarslfgrqawrn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_oCFEhHMC7ETCXNwJKIFzwg_qOdA9f0i";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// LOAD NEWS

async function loadNews() {

const news =
document.getElementById("news");


const { data, error } =
await supabaseClient
.from("articles")
.select("*")
.eq("published", true)
.order("created_at", {
ascending: false
});


if (error) {

console.error(error);

news.innerHTML =
"<div class='empty'>Unable to load news.</div>";

return;

}


if (!data || data.length === 0) {

news.innerHTML =
"<div class='empty'>No news stories published yet.</div>";

return;

}


news.innerHTML = "";


data.forEach(article => {

const card =
document.createElement("article");

card.className =
"card";


let image = "";

if (article.image_url) {

image =
`<img src="${article.image_url}"
alt="${article.title}">`;

}


card.innerHTML = `

${image}

<div class="card-content">

<div class="category">
${article.category || "News"}
</div>

<h3>
${article.title}
</h3>

<p>
${article.content.substring(0, 150)}...
</p>

<div class="date">
${new Date(article.created_at).toLocaleString()}
</div>

<a class="read"
href="article.html?id=${article.id}">
Read Full Story →
</a>

</div>

`;


news.appendChild(card);

});

}


loadNews();

</script>

</body>

</html>
