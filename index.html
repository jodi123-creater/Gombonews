<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gombo News | Uganda News Today</title>

<meta name="description" content="Gombo News brings you the latest news from Uganda, Africa and around the world.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.logo span {
  color: #f4b400;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 15px;
  font-size: 14px;
}

.breaking {
  background: #d71920;
  color: white;
  padding: 10px 5%;
  font-weight: bold;
}

.container {
  width: 90%;
  max-width: 1100px;
  margin: 25px auto;
}

.ad {
  background: #e8e8e8;
  min-height: 90px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #777;
  margin: 20px 0;
  border-radius: 6px;
}

.section-title {
  font-size: 24px;
  margin: 25px 0 15px;
  border-left: 5px solid #d71920;
  padding-left: 10px;
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.category {
  color: #d71920;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

.card h3 {
  margin: 7px 0;
  font-size: 19px;
}

.card p {
  color: #666;
  font-size: 14px;
}

.date {
  margin-top: 10px;
  color: #999;
  font-size: 12px;
}

.empty {
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 8px;
}

footer {
  background: #111;
  color: #bbb;
  text-align: center;
  padding: 30px 15px;
  margin-top: 40px;
}

footer h2 {
  color: white;
  margin-bottom: 10px;
}

@media (max-width: 700px) {
  header {
    display: block;
  }

  nav {
    margin-top: 12px;
  }

  nav a {
    margin-right: 10px;
    margin-left: 0;
  }

  .news-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    Gombo<span>News</span>
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Uganda</a>
    <a href="#">Business</a>
    <a href="#">Sports</a>
    <a href="#">Entertainment</a>
  </nav>

</header>

<div class="breaking">
  BREAKING NEWS • Gombo News
</div>

<div class="container">

  <div class="ad">
    Advertisement
  </div>

  <h2 class="section-title">
    Latest News
  </h2>

  <div id="news" class="news-grid">
    <div class="empty">
      Loading latest news...
    </div>
  </div>

  <div class="ad">
    Advertisement
  </div>

</div>

<footer>

  <h2>Gombo News</h2>

  <p>
    Uganda News • Africa • Business • Sports • Entertainment
  </p>

  <p>
    © 2026 Gombo News. All rights reserved.
  </p>

</footer>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL =
"https://ljdyhkffarslfgrqawrn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_oCFEhHMC7ETCXNwJKIFzwg_qOdA9f0i";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// LOAD PUBLISHED STORIES

async function loadNews() {

  const newsContainer =
    document.getElementById("news");

  const { data, error } =
    await supabaseClient
      .from("articles")
      .select("*")
      .eq("published", true)
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    newsContainer.innerHTML =
      "<div class='empty'>Unable to load news.</div>";

    return;
  }

  if (!data || data.length === 0) {

    newsContainer.innerHTML =
      "<div class='empty'>No news stories published yet.</div>";

    return;
  }

  newsContainer.innerHTML = "";

  data.forEach(article => {

    const card =
      document.createElement("article");

    card.className = "card";

    const image =
      article.image_url
      ? `<img src="${article.image_url}" alt="${article.title}">`
      : "";

    card.innerHTML = `

      ${image}

      <div class="card-content">

        <div class="category">
          ${article.category}
        </div>

        <h3>
          ${article.title}
        </h3>

        <p>
          ${article.content.substring(0, 150)}...
        </p>

        <div class="date">
          ${new Date(article.created_at).toLocaleString()}
        </div>

      </div>
    `;

    newsContainer.appendChild(card);

  });
}

loadNews();

</script>

</body>
</html>
