<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gombo News</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header span {
  color: #f4b400;
}

nav {
  margin-top: 12px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 8px;
  font-size: 14px;
}

.breaking {
  background: #d71920;
  color: white;
  padding: 10px;
  font-weight: bold;
  text-align: center;
}

.container {
  width: 92%;
  max-width: 1100px;
  margin: 20px auto;
}

.ad {
  background: #ddd;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  margin: 20px 0;
}

h2 {
  border-left: 5px solid #d71920;
  padding-left: 10px;
}

#news {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px #ccc;
}

.card img {
  width: 100%;
  height: 190px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.category {
  color: #d71920;
  font-size: 12px;
  font-weight: bold;
}

.card h3 {
  font-size: 20px;
  margin: 8px 0;
}

.card p {
  color: #555;
  line-height: 1.5;
}

.read {
  display: inline-block;
  margin-top: 10px;
  color: #d71920;
  font-weight: bold;
  text-decoration: none;
}

.empty {
  background: white;
  padding: 25px;
  text-align: center;
  border-radius: 8px;
}

.error {
  background: #ffe0e0;
  color: #a00000;
  padding: 20px;
  border-radius: 8px;
}

footer {
  margin-top: 40px;
  background: #111;
  color: white;
  padding: 30px;
  text-align: center;
}

@media(max-width:700px) {
  #news {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>

<h1>Gombo<span>News</span></h1>

<nav>
<a href="index.html">Home</a>
<a href="index.html">Uganda</a>
<a href="index.html">Business</a>
<a href="index.html">Sports</a>
<a href="index.html">Entertainment</a>
</nav>

</header>

<div class="breaking">
BREAKING NEWS • GOMBO NEWS
</div>

<div class="container">

<div class="ad">
Advertisement
</div>

<h2>Latest News</h2>

<div id="news">
<div class="empty">Loading news...</div>
</div>

<div class="ad">
Advertisement
</div>

</div>

<footer>
<h2>Gombo News</h2>
<p>Uganda • Africa • Business • Sports • Entertainment</p>
<p>© 2026 Gombo News</p>
</footer>


<script>

const SUPABASE_URL ="https://ljdyhkffarslfgrqawrn.supabase.co";

const SUPABASE_KEY = "sb_publishable_oCFEhHMC7ETCXNwJKIFzwg_qOdA9f0i";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadNews() {

  const box = document.getElementById("news");

  box.innerHTML =
    '<div class="empty">Loading news...</div>';


  const result = await db
    .from("articles")
    .select("*")
    .eq("published", true)
    .order("created_at", {
      ascending: false
    });


  if (result.error) {

    console.error(result.error);

    box.innerHTML =
      '<div class="error">Database error: ' +
      result.error.message +
      '</div>';

    return;
  }


  if (!result.data || result.data.length === 0) {

    box.innerHTML =
      '<div class="empty">' +
      'No published stories found.' +
      '</div>';

    return;
  }


  box.innerHTML = "";


  result.data.forEach(function(article) {

    const card =
      document.createElement("div");

    card.className = "card";


    let image = "";

    if (article.image_url) {

      image =
        '<img src="' +
        article.image_url +
        '" alt="' +
        article.title +
        '">';

    }


    card.innerHTML =

      image +

      '<div class="card-content">' +

      '<div class="category">' +
      (article.category || "NEWS") +
      '</div>' +

      '<h3>' +
      article.title +
      '</h3>' +

      '<p>' +
      (article.content || "").substring(0, 180) +
      '...</p>' +

      '<a class="read" href="article.html?id=' +
      article.id +
      '">' +
      'Read Full Story →' +
      '</a>' +

      '</div>';


    box.appendChild(card);

  });

}


loadNews();

</script>

</body>
</html>
